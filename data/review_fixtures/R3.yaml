id: R3
design_ref: T4
files:
  loan_calc/rates.py: |
    from .dti import calculate_dti
    from .models import Applicant

    RATE_TIERS = {740: 0.060, 680: 0.070, 620: 0.085, 580: 0.105}

    def pick_rate(applicant: Applicant) -> float:
        dti = calculate_dti(applicant.monthly_debt_payments, applicant.monthly_income)
        threshold = max((value for value in RATE_TIERS if applicant.credit_score >= value), default=580)
        rate = RATE_TIERS[threshold]
        return rate + 0.005 if dti >= 0.36 else rate

    def estimate_monthly_payment(principal: float, annual_rate: float, term_months: int) -> float:
        monthly_rate = annual_rate / 12
        if annual_rate == 0:
            return principal / term_months
        factor = (1 + monthly_rate) ** term_months
        return principal * monthly_rate * factor / (factor - 1)
expected:
  decision: reject
  rules: [coverage.below_threshold]
  min_risk: medium
